
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safechain-ingress
  namespace: safechain-mk
  labels:
    app.kubernetes.io/part-of: safechain-mk
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: safechain-mk.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: safechain-backend
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: safechain-frontend
                port:
                  number: 8080
