# Deployment за frontend-от (nginx-от од frontend/Dockerfile, кој сервира
# статичкиот React build и проксира /api/* кон backend-от преку
# frontend/nginx.conf.template).
#
# Исто како backend-от: stateless статички фајлови + reverse-proxy
# конфигурација, нема локална состојба, па Deployment (не StatefulSet) е
# точниот избор.
#
# ⚠️ .github/workflows/ci-cd.yml исто го патчира ова image полето со `yq` при
# секој push на main — frontend контејнерот мора да остане ПРВИОТ во
# containers листата.
#
# Нема одделен frontend-configmap.yaml фајл: единствените "runtime нагодувања"
# што nginx-от ги бара се BACKEND_HOST/BACKEND_PORT подолу (env-от што
# nginx-овиот envsubst влезен скрипт ги користи за да го генерира
# /etc/nginx/conf.d/default.conf при старт — см. frontend/nginx.conf.template
# и frontend/Dockerfile). Тие само го огледуваат името/портот на
# backend-service.yaml дефинирани тука веднаш подолу, па засебен ConfigMap
# фајл само за две вредности би бил непотребна индирекција.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safechain-frontend
  namespace: safechain-mk
  labels:
    app.kubernetes.io/name: safechain-frontend
    app.kubernetes.io/part-of: safechain-mk
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: safechain-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safechain-frontend
        app.kubernetes.io/part-of: safechain-mk
    spec:
      containers:
        - name: safechain-frontend
          image: tamara0/safechain-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "safechain-backend"
            - name: BACKEND_PORT
              value: "8787"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
