
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safechain-frontend
  namespace: safechain-mk
  labels:
    app.kubernetes.io/name: safechain-frontend
    app.kubernetes.io/part-of: safechain-mk
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: safechain-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safechain-frontend
        app.kubernetes.io/part-of: safechain-mk
    spec:
      containers:
        - name: safechain-frontend
          image: tamara0/safechain-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "safechain-backend"
            - name: BACKEND_PORT
              value: "8787"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
